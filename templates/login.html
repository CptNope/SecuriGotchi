<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecuriGotchi — Local Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="masthead"><div class="shell"><p class="eyebrow">LOCAL ADMIN LOGIN</p><h1>🛡️ SecuriGotchi</h1></div></header>
<main class="shell login-layout"><section class="panel"><h2>Sign in</h2>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label for="username">Username</label><input id="username" name="username" value="admin" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Unlock dashboard</button></form>
<p class="hint">First launch? Run <code>python gotchi_auth.py init-admin</code> in the terminal. This login protects a localhost application, not an internet-facing service.</p>
</section></main></body></html>
