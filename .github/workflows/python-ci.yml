name: Python security baseline
on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q gotchi_agent.py gotchi_chain.py gotchi_memory.py gotchi_mission.py gotchi_query.py gotchi_vector.py gotchi_webui.py gotchi_monitor.py gotchi_notifications.py gotchi_service.py gotchi_platform.py gotchi_lock.py gotchi_native.py gotchi_insights.py gotchi_mcp.py gotchi_explain.py install.py plugin_manager.py plugin_runner.py plugins
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  mcp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-mcp.txt
      - name: MCP v2 in-memory and stdio integration
        run: python -m unittest discover -s tests -p test_mcp_sdk.py -v
