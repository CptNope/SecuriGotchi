name: Python security baseline (lean)

# A pull request runs a quick Linux check. Run workflow manually for all OSes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securigotchi-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 5
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        python-version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["3.11","3.12"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q gotchi_agent.py gotchi_chain.py gotchi_memory.py gotchi_mission.py gotchi_query.py gotchi_vector.py gotchi_webui.py gotchi_monitor.py gotchi_notifications.py gotchi_service.py gotchi_platform.py gotchi_lock.py gotchi_native.py gotchi_insights.py gotchi_mcp.py gotchi_explain.py gotchi_ai_ops.py install.py plugin_manager.py plugin_runner.py plugins
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  mcp-integration:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-mcp.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-mcp.txt
      - name: MCP v2 in-memory and stdio integration
        run: python -m unittest discover -s tests -p test_mcp_sdk.py -v
